<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="300" viewBox="0 0 1040 300" role="img" aria-labelledby="title description">
  <title id="title">Anatomy of an Angin text field</title>
  <desc id="description">The visible label points to label, the input to id and native props, and helper text to helperText or error. The label and description are linked to the input.</desc>
  <rect x="1" y="1" width="1038" height="298" rx="16" fill="#f8fafc" stroke="#e2e8f0"/>
  <g font-family="Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif">
    <rect x="28" y="38" width="400" height="224" rx="12" fill="#ffffff" stroke="#e2e8f0"/>
    <text x="54" y="91" font-size="20" font-weight="600" fill="#0f172a">Email address</text>
    <rect x="54" y="112" width="348" height="54" rx="8" fill="#ffffff" stroke="#2563eb" stroke-width="2"/>
    <text x="70" y="146" font-size="19" fill="#334155">ada@example.com</text>
    <text x="54" y="206" font-size="17" fill="#64748b">Use your work address.</text>
    <g stroke="#2563eb" stroke-width="2" fill="none">
      <path d="M227 84h273"/>
      <path d="M411 139h89"/>
      <path d="M267 200h233"/>
    </g>
    <g fill="#2563eb">
      <circle cx="227" cy="84" r="4"/>
      <circle cx="411" cy="139" r="4"/>
      <circle cx="267" cy="200" r="4"/>
    </g>
    <text x="524" y="82" font-size="21" font-weight="650" fill="#0f172a">label</text>
    <text x="524" y="106" font-size="16" fill="#475569">A visible name, linked to the control's id.</text>
    <text x="524" y="143" font-size="21" font-weight="650" fill="#0f172a">id + native input props</text>
    <text x="524" y="167" font-size="16" fill="#475569">type, name, value, onChange, required, ref…</text>
    <text x="524" y="204" font-size="21" font-weight="650" fill="#0f172a">helperText / error</text>
    <text x="524" y="228" font-size="16" fill="#475569">Connected with aria-describedby; error takes priority.</text>
  </g>
</svg>
