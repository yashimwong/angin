name: Check
on:
  push:
  pull_request:
jobs:
  library:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --legacy-peer-deps
      - run: npm run check
      - uses: actions/upload-artifact@v4
        with:
          name: documentation-site
          path: out/
          if-no-files-found: error
          retention-days: 14
      - run: npm pack
